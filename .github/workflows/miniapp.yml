name: miniapp

on:
  pull_request:
    paths:
      - 'frontend/miniapp/**'
      - '.github/workflows/miniapp.yml'

jobs:
  miniapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/miniapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y pnpm@12.16.1 install --frozen-lockfile
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:mp-weixin
      - run: test -f dist/weapp/app.json
      - run: npm run build:h5
      - run: test -f dist/h5/index.html
      # 生产构建打开微信 mock 必须失败
      - run: |
          if TARO_APP_WECHAT_MOCK=true NODE_ENV=production npm run build:h5; then
            echo "生产构建开着 TARO_APP_WECHAT_MOCK 却成功了" >&2
            exit 1
          fi
